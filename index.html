<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Compass</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Welcome to Campus Compass!
    </h1>
    <p>Use the options below to find your way!</p>

    <form>
        <label for="building">Select a building:</label>
       <select name="building" id="building" onchange="window.location.href=this.value;">
        <option value="" selected disabled hidden></option>
        <option value="smyth.html">Smyth Hall</option>
       </select> 
    </form>

    <form>
        <label for="department">Select a department:</label>
       <select name="department" id="department" onchange="window.location.href=this.value;">
        <option value="" selected disabled hidden></option>
        <option value="smyth.html?room=1">1 Stop</option>
        <option value="smyth.html?room=5">Admissions</option>
        <option value="smyth.html?room=8">Financial Aid</option>
        <option value="smyth.html?room=2">Police Department</option>
        <option value="smyth.html?room=3">Scholarship Office</option>
        <option value="smyth.html#kinseology">Testing Center</option>
        <option value="user.html">login</option>

       </select>
    </form>

    <form>
        <label for="office">Select an employee:</label>
       <select name="office" id="office" onchange="window.location.href=this.value;">
        <option value="" selected disabled hidden></option>
        <option value="smyth.html?room=9">Dean of Student Services</option>
        <option value="smyth.html?room=10">Dr. Bob Loblaw - Legal Studies</option>
        <option value="smyth.html?room=11">Jim Naseum - Kinesiology Professor</option>
        <option value="smyth.html?room=12">Dr. Callum "Cal" Culator - Math Professor</option>
        <option value="smyth.html?room=13">Dr. Flora Ide - Dental Hygiene Professor</option>

       </select>
    </form>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
