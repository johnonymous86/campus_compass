<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Campus Compass</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js" defer></script>
    <script src="auth.js" defer></script>
    

    <div class="container-fluid header-inner py-3 d-flex justify-content-between align-items-center">
        <a href="index.html">
            <picture>
                <source media="(min-width: 768px)" srcset="assets/cc_logo.png">
                <img src="assets/cc_logo.png" alt="Campus Directory home" class="site-logo">
            </picture>
        </a>
        <div id="auth-controls"></div>
    </div>

    <nav class="navbar navbar-expand-md bg-black" data-bs-theme="dark">
        <div class="container-fluid header-inner">
            <button class="navbar-toggler ms-auto" type="button"
                    data-bs-toggle="collapse" data-bs-target="#main-nav"
                    aria-controls="main-nav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="directory.html#buildings">Buildings</a></li>
                    <li class="nav-item"><a class="nav-link" href="directory.html#departments">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="directory.html#employees">Employees</a></li>
                </ul>
            </div>
        </div>
    </nav>
</head>
<body>
    <main class="content-box">
      <div class="content-text">  
        <h1>Welcome to Campus Compass!
        </h1>
        <p>Use the options below to look up locations on campus!</p>

    <form>
        <label for="building" class="visually-hidden">Select a building:</label>
       <select name="building" id="building" class="form-select form-select-lg" onchange="window.location.href=this.value;">
        <option value="" selected disabled hidden>Select a building</option>
        <option value="smyth.html">Smyth Hall</option>
       </select> 
    </form>

    <form>
        <label for="department" class="visually-hidden">Select a department:</label>
       <select name="department" id="department" class="form-select form-select-lg" onchange="window.location.href=this.value;">
        <option value="" selected disabled hidden>Select a department</option>
        <option value="smyth.html?room=1">1 Stop</option>
        <option value="smyth.html?room=5">Admissions</option>
        <option value="smyth.html?room=8">Financial Aid</option>
        <option value="smyth.html?room=2">Police Department</option>
        <option value="smyth.html?room=3">Scholarship Office</option>
        <option value="smyth.html#kinseology">Testing Center</option>

       </select>
    </form>

    <form>
        <label for="office" class="visually-hidden">Select an employee:</label>
       <select name="office" id="office" class="form-select form-select-lg" onchange="window.location.href=this.value;">
        <option value="" selected disabled hidden>Select an employee</option>
        <option value="smyth.html?room=9">Dean of Student Services</option>
        <option value="smyth.html?room=10">Dr. Bob Loblaw - Legal Studies</option>
        <option value="smyth.html?room=11">Jim Naseum - Kinesiology Professor</option>
        <option value="smyth.html?room=12">Dr. Callum "Cal" Culator - Math Professor</option>
        <option value="smyth.html?room=13">Dr. Flora Ide - Dental Hygiene Professor</option>

       </select>
    </form>
  </div>
 <div class="content-image d-none d-md-block">
    <img src="assets/Aerial.jpg" alt="" loading="lazy">
 </div>

</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
