<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Campus Compass</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="dashboard.js" defer></script>

    <div class="container-fluid header-inner py-3 d-flex justify-content-between align-items-center">
        <a href="index.html">
            <picture>
                <source media="(min-width: 768px)" srcset="assets/cc_logo.png">
                <img src="assets/cc_logo.png" alt="Campus Directory home" class="site-logo">
            </picture>
        </a>
        <div id="auth-controls"></div>
    </div>

    <nav class="navbar navbar-expand-md bg-black" data-bs-theme="dark">
        <div class="container-fluid header-inner">
            <button class="navbar-toggler ms-auto" type="button"
                    data-bs-toggle="collapse" data-bs-target="#main-nav"
                    aria-controls="main-nav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="directory.html#buildings">Buildings</a></li>
                    <li class="nav-item"><a class="nav-link" href="directory.html#departments">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="directory.html#employees">Employees</a></li>
                </ul>
            </div>
        </div>
    </nav>

</head>
<body>
    <div class="admin-section" id="admin-section" style="display: none;">
        <h1>You are logged in!</h1>

        <ul id="room-list"></ul>

        <form id="edit-form" style="display: none;">
            <h2>Edit room</h2>
            <label for="edit-name">Name</label>
            <input type="text" id="edit-name" required>
        
            <label for="edit-number">Room number</label>
            <input type="text" id="edit-number" required>
        
            <button type="submit">Save</button>
            <p id="edit-message"></p>
        </form>
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    

</body>
</html>
