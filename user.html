<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Log In </title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="script.js" defer></script>

    <div class="container-fluid header-inner py-3 d-flex justify-content-between align-items-center">
        <a href="index.html">
            <picture>
                <source media="(min-width: 768px)" srcset="assets/cc_logo.png">
                <img src="assets/cc_logo.png" alt="Campus Directory home" class="site-logo">
            </picture>
        </a>
        <div id="auth-controls"></div>
    </div>

    <nav class="navbar navbar-expand-md bg-black" data-bs-theme="dark">
        <div class="container-fluid">
            <button class="navbar-toggler ms-auto" type="button"
                    data-bs-toggle="collapse" data-bs-target="#main-nav"
                    aria-controls="main-nav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="smyth.html">Smyth Hall</a></li>
                    <li class="nav-item"><a class="nav-link" href="grayson.html">Grayson Hall</a></li>
                </ul>
            </div>
        </div>
    </nav>

</head>
<body>
    <h1>Use your log in credentials below:</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="smyth.html">Smyth Hall</a> 
      </nav>

    <div class="login-container">
        <h2>Login</h2>
        <form id="login-form" action="/login" method="POST">
            <div class="input-group">
                <label for="email">Email: </label>
                <input type="text" id="email" name="email" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit">Log In</button>
        </form>
    </div>
    
    <div id="error-box" class="error-message"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
